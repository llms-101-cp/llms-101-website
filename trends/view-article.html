<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... · LLMs 101</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#3d2a18;--gold:#B8860B;--tan:#D2B48C;--cream:#FAF8F4;
  --muted:#9a7a5e;--light:#F5EDD8;--border:rgba(184,134,11,.18);--white:#fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;font-weight:300;background:var(--cream);color:var(--brown);line-height:1.8;font-size:16px;display:flex;flex-direction:column;min-height:100vh}
main{flex:1}
header{position:sticky;top:0;z-index:100;background:rgba(250,248,244,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between}
.site-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--brown);text-decoration:none;letter-spacing:.02em}
.site-title span{color:var(--gold)}
nav{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
nav a{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:.3rem .7rem;border-radius:20px;transition:color .2s,background .2s}
nav a:hover{color:var(--gold)}
nav a.active{color:var(--brown);background:var(--light)}
.wrapper{max-width:760px;margin:0 auto;padding:3.5rem 2rem 5rem}
/* back link */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:2rem;transition:color .2s}
.back-link:hover{color:var(--gold)}
/* article meta */
.meta-header{margin-bottom:2rem}
.article-tag{display:inline-block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(184,134,11,.1);color:var(--gold);border:1px solid rgba(184,134,11,.25);padding:2px 10px;border-radius:20px;margin-bottom:1rem}
.article-meta-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}
.article-date{font-size:.72rem;color:var(--muted)}
.article-read{font-size:.72rem;color:var(--tan)}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4.5vw,2.9rem);font-weight:400;color:var(--brown);line-height:1.15;margin-bottom:.75rem}
h1 span{color:var(--gold)}
.standfirst{font-size:1rem;color:var(--muted);line-height:1.8;font-style:italic;border-left:3px solid var(--gold);padding-left:1.25rem;margin:1.5rem 0 2rem}
/* article body — markdown rendered content */
.article-body{font-size:.95rem;color:#5a3e28;line-height:1.85}
.article-body p{margin-bottom:1.1rem}
.article-body h2{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;color:var(--brown);margin:2.2rem 0 .7rem;line-height:1.2}
.article-body h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--brown);margin:1.6rem 0 .5rem}
.article-body strong{font-weight:500;color:var(--brown)}
.article-body em{font-style:italic;color:var(--muted)}
.article-body a{color:var(--gold);text-decoration:none}
.article-body a:hover{text-decoration:underline}
.article-body ul,.article-body ol{padding-left:1.5rem;margin-bottom:1rem}
.article-body li{margin-bottom:.4rem;font-size:.95rem;color:#5a3e28}
.article-body blockquote{border-left:3px solid var(--gold);padding:.75rem 1.25rem;background:var(--white);border-radius:0 8px 8px 0;margin:1.25rem 0;color:var(--muted);font-style:italic}
.article-body hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
/* before/after blocks — triggered by [before] / [after] markers in body */
.ba-block{display:grid;grid-template-columns:1fr 1fr;gap:1px;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:1.5rem 0}
.ba-side{padding:1rem 1.25rem}
.ba-old{background:rgba(61,42,24,.04)}
.ba-new{background:rgba(184,134,11,.05)}
.ba-head{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem;font-weight:500}
.ba-old .ba-head{color:var(--muted)}
.ba-new .ba-head{color:var(--gold)}
.ba-content{font-size:.84rem;color:var(--brown);line-height:1.65}
/* callout boxes — triggered by [callout] marker */
.callout{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:1rem 1.4rem;margin:1.5rem 0}
.callout-label{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
.callout p{font-size:.88rem;color:var(--brown);line-height:1.7;margin:0}
/* loading state */
.loading-state{text-align:center;padding:4rem 0;color:var(--muted)}
.loading-rule{width:30px;height:2px;background:rgba(184,134,11,.3);margin:.75rem auto}
/* error state */
.error-state{text-align:center;padding:4rem 0}
.error-state h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--brown);margin-bottom:.5rem}
.error-state p{font-size:.85rem;color:var(--muted);margin-bottom:1.5rem}
.error-btn{display:inline-block;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--brown);background:var(--light);border:1px solid var(--tan);text-decoration:none;padding:.5rem 1.25rem;border-radius:4px}
/* further reading */
.further-reading{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.4rem 1.75rem;margin:2.5rem 0 1rem}
.fr-title{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:400;color:var(--brown);margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.fr-list{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.fr-list li{display:flex;align-items:baseline;gap:.5rem;font-size:.82rem}
.fr-list li::before{content:'›';color:var(--gold);flex-shrink:0}
.fr-list a{color:var(--brown);text-decoration:none;transition:color .2s}
.fr-list a:hover{color:var(--gold)}
footer{background:var(--brown);color:var(--muted);text-align:center;padding:1.5rem 2rem;font-size:.78rem;letter-spacing:.04em}
footer a{color:var(--gold);text-decoration:none}
@media(max-width:600px){
  header{padding:.75rem 1rem}
  .wrapper{padding:2.5rem 1rem 4rem}
  .ba-block{grid-template-columns:1fr}
}
</style>
<script src="/scripts/render-nav.js" defer></script>
</head>
<body>
<header>
  <button class="hamburger" id="hamburger" aria-label="Menu" tabindex="0">
    <span></span><span></span><span></span>
  </button>
  <a href="/" class="site-title"><span>LLMs</span> 101</a>
  <div id="site-nav-bar"></div>
</header>
<div id="nav-overlay"></div>
<div id="nav-drawer"></div>
<main>
  <div class="wrapper">
    <a href="/trends" class="back-link">← Back to Trends</a>
    <article id="article-render-target">
      <div class="loading-state">
        <div class="loading-rule"></div>
        <p style="font-size:.85rem">Loading article...</p>
        <div class="loading-rule"></div>
      </div>
    </article>
  </div>
</main>
<footer>
  <p></p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/**
 * view-article.html — Article viewer for Decap CMS JSON articles
 *
 * FIXED VERSION: relies exclusively on the articles_index.json lookup,
 * which now includes a reliable "file" field written by generate-indices.js.
 * The previous version's Step 3 (brute-force date-prefix guessing) has been
 * removed entirely — it only succeeded for articles published on the
 * 7th/14th/21st/28th of a sampled month, and failed silently otherwise.
 *
 * If the index lookup fails, this version shows a clear error explaining
 * the likely cause (the index hasn't rebuilt yet) instead of silently
 * trying ~24 guessed URLs with no transparency.
 *
 * URL format: /trends/view-article.html?article=agentic-ai-explained
 */

// ── Helpers ──────────────────────────────────────────────────────────────────

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function formatDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return `${ordinal(d.getDate())} ${d.toLocaleDateString('en-GB', { month: 'long' })} ${d.getFullYear()}`;
}

function tagClass(category) {
  const map = {
    'Trend Spotlight': 'tag-trend',
    'Deep Dive':       'tag-deep',
    'Quarterly':       'tag-quarterly',
    'Model Update':    'tag-trend',
    'Article':         'tag-explainer',
  };
  return map[category] || 'tag-explainer';
}

function renderMarkdown(text) {
  if (!text) return '';
  if (typeof marked !== 'undefined') {
    return marked.parse(text);
  }
  return text.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
}

function showError(msg) {
  document.getElementById('article-render-target').innerHTML = `
    <div class="error-state">
      <h3>Article not found</h3>
      <p>${msg}</p>
      <a href="/trends" class="error-btn">← Back to Trends</a>
    </div>`;
}

// ── Main loader ───────────────────────────────────────────────────────────────

async function loadArticle() {
  const urlParams = new URLSearchParams(window.location.search);
  const requestedSlug = urlParams.get('article');

  if (!requestedSlug) {
    showError('No article specified. Please return to the Trends page and select an article.');
    return;
  }

  try {
    let articleData = null;

    // ── Step 1: Look up the article via the index (now the ONLY lookup path) ──
    // generate-indices.js now writes a reliable "file" field for every entry,
    // so this should succeed for any article whose index has been rebuilt
    // since the fix. The index also rebuilds automatically via indexing.yml
    // whenever content/articles/** changes.
    try {
      const indexRes = await fetch('/content/articles_index.json', { cache: 'no-store' });
      if (indexRes.ok) {
        const index = await indexRes.json();
        const match = index.find(a =>
          a.slug === requestedSlug ||
          (a.slug && a.slug.endsWith('-' + requestedSlug)) ||
          (a.file && a.file.includes(requestedSlug)) ||
          (a.url && a.url.includes(requestedSlug))
        );
        if (match && match.file) {
          const fileRes = await fetch(`/${match.file}`, { cache: 'no-store' });
          if (fileRes.ok) {
            articleData = await fileRes.json();
          }
        }
      }
    } catch (e) {
      // Index fetch failed entirely — fall through to Step 2 below.
    }

    // ── Step 2: Fallback — try a direct slug match (no date prefix) ───────────
    // Covers the case where a file was saved without Decap's date-prefix
    // convention, e.g. manually created as content/articles/{slug}.json.
    if (!articleData) {
      try {
        const directRes = await fetch(`/content/articles/${requestedSlug}.json`, { cache: 'no-store' });
        if (directRes.ok) {
          articleData = await directRes.json();
        }
      } catch (e) {
        // Continue to error state below.
      }
    }

    if (!articleData) {
      throw new Error(
        'Could not locate this article. If it was just published, the site index ' +
        'may still be rebuilding — try again in a minute. Otherwise the article ' +
        'may have been removed or the link may be incorrect.'
      );
    }

    // ── Step 3: Render the article ──────────────────────────────────────────
    document.title = `${articleData.title || 'Article'} · LLMs 101`;
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute('content', `${articleData.title} · LLMs 101`);

    const bodyHTML = renderMarkdown(articleData.body || '');
    const target = document.getElementById('article-render-target');

    target.innerHTML = `
      <div class="meta-header">
        <span class="article-tag">${articleData.category || 'Explainer'}</span>
        <h1>${articleData.title || 'Untitled'}</h1>
        <div class="article-meta-row">
          <span class="article-date">${formatDate(articleData.date)}</span>
          ${articleData.read_time ? `<span class="article-read">${articleData.read_time}</span>` : ''}
        </div>
      </div>
      ${articleData.summary ? `<p class="standfirst">${articleData.summary}</p>` : ''}
      <div class="article-body">${bodyHTML}</div>
      <div class="further-reading">
        <div class="fr-title">Continue reading</div>
        <ul class="fr-list">
          <li><a href="/trends">All Trends &amp; Explainers</a></li>
          <li><a href="/models">Frontier Model Directory</a></li>
          <li><a href="/tracker">Model Tracker &amp; Rankings</a></li>
        </ul>
      </div>
    `;
    // NOTE: the previous hardcoded link to a specific quarterly report
    // (/trends/state-of-llms-q2-2026) has been removed from "Continue
    // reading" — it would 404 the moment that one specific article is
    // renamed or removed, on every single article rendered by this viewer.
    // If you want to link a flagship report here, fetch it from
    // reports_index.json[0] dynamically rather than hardcoding a URL.

  } catch (err) {
    console.error('Article load error:', err);
    showError(err.message);
  }
}

document.addEventListener('DOMContentLoaded', loadArticle);
</script>
</body>
</html>
