backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "mindmap_nodes"
    label: "Mind Map Nodes"
    folder: "content/nodes"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "ID (e.g., math, linear-algebra)", name: "id", widget: "string"}
      - {label: "Label (Short Title)", name: "label", widget: "string"}
      - {label: "Subtitle", name: "sub", widget: "string", required: false}
      - {label: "Tag (e.g., Branch, Overview)", name: "tag", widget: "string"}
      - {label: "Theme Color", name: "theme", widget: "select", options: ["root", "math", "train", "arch", "prompt", "theme"]}
      - {label: "Has Children?", name: "hasChildren", widget: "boolean", default: false}
      - {label: "Sidebar Title", name: "title", widget: "string"}
      - {label: "Sidebar Body Paragraphs (HTML allowed)", name: "body", widget: "text"}

  - name: "pages"
    label: "Website Pages"
    files:
      - file: "content/pages/beginners.json"
        label: "AI for Beginners"
        name: "beginners"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "AI for beginners"}
          - {label: "Page Content", name: "body", widget: "markdown"}
      - file: "content/pages/resources.json"
        label: "Interesting Resources"
        name: "resources"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "Interesting Resources"}
          - {label: "Page Content", name: "body", widget: "markdown"}
      - file: "content/pages/about.json"
        label: "About this site"
        name: "about"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "About this site"}
          - {label: "Page Content", name: "body", widget: "markdown"}
      - file: "content/pages/contact.json"
        label: "Contact"
        name: "contact"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "Contact"}
          - {label: "Page Content", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings/theme.json"
        label: "Theme Colors"
        name: "theme"
        fields:
          - label: "Base Theme Preset"
            name: "preset"
            widget: "select"
            default: "Sahel (Default)"
            options:
              - "Sahel (Default)"
              - "Dark Mode"
              - "Ocean"
              - "Forest"
              - "HC Light"
              - "HC Dark"
              - "Midnight Blue"
              - "Sunset"
              - "Cherry Blossom"
              - "Cyberpunk"
              - "Monochrome"
              - "Autumn"
              - "Lavender"
              - "Coffee House"
              - "Mint Chocolate"
              - "Slate & Copper"
              - "Vintage Rose"
              - "Deep Purple"
              - "Arctic Ice"
              - "Solarized Dark"
          - label: "Override: Main Text Color"
            name: "text_override"
            widget: "color"
            required: false
            hint: "Leave blank to use the theme's default text color."
          - label: "Override: Background Color"
            name: "bg_override"
            widget: "color"
            required: false
            hint: "Leave blank to use the theme's default background."
          - label: "Override: Accent/Header Color"
            name: "brown_override"
            widget: "color"
            required: false
            hint: "Overrides the dark brown/accent colors."

  - name: "articles"
    label: "Articles & Model Updates"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Article", "Model Update", "Deep Dive"] }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Summary Paragraph", name: "summary", widget: "text" }
      - { label: "Body Content (Markdown allowed)", name: "body", widget: "markdown" }

  - name: "reports"
    label: "Quarterly Reports"
    folder: "content/reports"
    create: true
    slug: "{{year}}-q{{quarter}}-report"
    extension: "json"
    format: "json"
    fields:
      - { label: "Report Title", name: "title", widget: "string" }
      - { label: "Fiscal Year", name: "year", widget: "number" }
      - { label: "Quarter (1-4)", name: "quarter", widget: "number" }
      - { label: "Executive Summary", name: "summary", widget: "text" }
      - { label: "Attach PDF Report", name: "pdf", widget: "file", required: false }
      - { label: "Raw JSON Financial Data (Optional)", name: "chartData", widget: "text", required: false, hint: "Paste raw data structure here to directly feed Chart.js layouts on the frontend." }
