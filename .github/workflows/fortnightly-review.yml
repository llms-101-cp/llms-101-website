name: Mid-Month Light Spot-Check

# Hybrid cadence (2026-07-22, cost restructure): the EXPENSIVE full review
# (every models.html card + every static page, live web-search-backed) now
# runs MONTHLY, folded into monthly-tracker-refresh.yml on the 1st. This
# workflow is the cheap mid-month off-week pass: a SINGLE web_search call
# ("what's changed since the ~1st full review?") plus the free
# checkUnmergedTrackerPRs() check. Report-only — it never fact-checks each
# card/page or auto-drafts corrections. The old every-other-Wednesday
# ISO-week-parity gate is retired; this is a plain 15th-of-month cron.
# See ARCHITECTURE.md's Full-Site Review section.

on:
  schedule:
    - cron: '0 15 15 * *'   # 15th of each month, 15:00 UTC — mid-month, ~2 wks after the 1st full review
  workflow_dispatch: {}

jobs:
  light-spot-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # lets the unmerged-tracker-PR check run `gh pr list`
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./llms101-automation

      # Report-only: one web_search spot-audit + the gh PR check. No commits,
      # no pushes, no per-card/per-page fact-checks — that's the monthly run.
      - name: Run light spot-check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          GH_TOKEN: ${{ github.token }}   # for the unmerged-tracker-PR check's `gh pr list`
        run: node scripts/fortnightly-review.js --light
        working-directory: ./llms101-automation
