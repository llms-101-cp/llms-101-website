name: Monthly Model Tracker Refresh

# Mirrors weekly-content.yml's cron + workflow_dispatch pattern, but on a
# monthly cadence (tracker.html's own hero text already promises "Updated
# monthly") and with a materially different publish mechanism: this opens a
# PR directly against tracker.html itself, rather than saving a draft for
# manual copy-paste via admin/review.html. See ARCHITECTURE.md "Model
# Tracker automation" section for why.

on:
  schedule:
    - cron: '0 9 1 * *' # 9am UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  refresh-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./llms101-automation

      - name: Generate refreshed tracker.html (web_search-enabled)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-tracker.js
        working-directory: ./llms101-automation

      # Only reached if generate-tracker.js succeeded — any validation
      # failure, JSON parse failure, or max_tokens truncation throws and
      # exits non-zero, which fails this whole job before any commit
      # happens. That's deliberate: matches generate-indices.js's existing
      # "fail loudly, don't write bad content" pattern.
      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="tracker-refresh-$(date +%Y-%m-%d)"
          git config user.name "llms101-bot"
          git config user.email "bot@llms101.com"
          git checkout -b "$BRANCH"
          git add tracker.html

          if git diff --staged --quiet; then
            echo "tracker.html is unchanged after generation — nothing to PR this month."
            exit 0
          fi

          git commit -m "Monthly Model Tracker refresh ($(date +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already open for $BRANCH — branch force-pushed, PR updated automatically."
          else
            gh pr create \
              --title "Monthly Model Tracker refresh ($(date +%Y-%m-%d))" \
              --body "Auto-generated by \`monthly-tracker-refresh.yml\`. The generation step used the \`web_search\` tool and passed schema validation (correct row count, valid tier/cost/badge values, no missing fields) before this PR was opened. **Still worth a human glance before merging** — verify the rankings and model names actually make sense, since search results can occasionally be stale or contradictory themselves. See the diff below." \
              --base main \
              --head "$BRANCH"
          fi

      # If generation failed, the error file (if one was written before the
      # throw) only exists on this ephemeral runner — upload it so it's not
      # lost the moment the job ends.
      - name: Upload error details if generation failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-generation-error
          path: llms101-automation/drafts/errors/tracker-error-*.txt
          if-no-files-found: ignore
