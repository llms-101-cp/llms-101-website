name: Monthly Tracker Refresh + Full-Site Review

# Two monthly jobs share ONE run (2026-07-22 cost restructure — avoid two
# independent monthly crons both hitting the API):
#   1. Full-site review (fortnightly-review.js, full mode): every models.html
#      card + every static page, live web-search-backed. Static-page
#      corrections auto-publish to main; stale model cards get drafts +
#      the generated→reviewed→APPLIED checkpoint. This is the EXPENSIVE pass
#      moved here from its old every-2-weeks cadence (the mid-month
#      fortnightly-review.yml is now just a cheap spot-check).
#   2. Tracker refresh (generate-tracker.js): opens a PR against tracker.html
#      for human merge (D1). See ARCHITECTURE.md "Model Tracker automation".
#
# ORDER MATTERS: the review runs FIRST (on main, auto-committing/pushing its
# corrections), THEN the tracker step cuts its branch from the now-updated
# main — so the tracker PR diff stays just tracker.html + changelog. The
# review step is `continue-on-error` so a review failure (e.g. API credit)
# never blocks the tracker refresh, and vice versa; each surfaces its own
# outcome (the review emails its own report).

on:
  schedule:
    - cron: '0 9 1 * *' # 9am UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  monthly-review-and-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write   # tracker opens a PR; review's gh pr list reads them
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./llms101-automation

      - name: Configure git identity
        run: |
          git config user.name "llms101-bot"
          git config user.email "bot@llms101.com"

      # FULL site review — runs first, on main. Auto-publishes static-page
      # corrections and commits model-card drafts + the report to main itself
      # (commit-then-push in the same script invocation, same pattern as
      # validate-and-publish.js). continue-on-error so a review failure never
      # blocks the tracker refresh below; the review sends its own report email.
      - name: Run monthly full-site review (models.html + static pages)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          GH_TOKEN: ${{ github.token }}   # for the unmerged-tracker-PR check's `gh pr list`
        run: node scripts/fortnightly-review.js
        working-directory: ./llms101-automation

      - name: Generate refreshed tracker.html (web_search-enabled)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-tracker.js
        working-directory: ./llms101-automation

      # Only reached if generate-tracker.js succeeded — any validation
      # failure, JSON parse failure, or max_tokens truncation throws and
      # exits non-zero, which fails this whole job before any commit
      # happens. That's deliberate: matches generate-indices.js's existing
      # "fail loudly, don't write bad content" pattern. The branch is cut
      # from main AFTER the review step pushed its corrections, so the PR
      # diff is only tracker.html + the tracker's own changelog entry.
      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="tracker-refresh-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add tracker.html content/changelog.json

          if git diff --staged --quiet; then
            echo "tracker.html is unchanged after generation — nothing to PR this month."
            exit 0
          fi

          git commit -m "Monthly Model Tracker refresh ($(date +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already open for $BRANCH — branch force-pushed, PR updated automatically."
          else
            gh pr create \
              --title "Monthly Model Tracker refresh ($(date +%Y-%m-%d))" \
              --body "Auto-generated by \`monthly-tracker-refresh.yml\`. The generation step used the \`web_search\` tool and passed schema validation (correct row count, valid tier/cost/badge values, no missing fields) before this PR was opened. **Still worth a human glance before merging** — verify the rankings and model names actually make sense, since search results can occasionally be stale or contradictory themselves. See the diff below." \
              --base main \
              --head "$BRANCH"
          fi

      # If generation failed, the error file (if one was written before the
      # throw) only exists on this ephemeral runner — upload it so it's not
      # lost the moment the job ends.
      - name: Upload error details if generation failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-generation-error
          path: llms101-automation/drafts/errors/tracker-error-*.txt
          if-no-files-found: ignore
