name: Auto-Generate Content Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/**'
      - 'content/reports/**'

# This block forces GitHub to give the execution runner full write privileges 
permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Explicitly targets your main branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Index Generator
        run: node scripts/generate-indices.js

      - name: Check for Changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Indexes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/articles_index.json content/reports_index.json
          git commit -m "chore: auto-regenerate content indexes"
          git push origin main
