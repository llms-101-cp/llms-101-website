backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "mindmap_nodes"
    label: "Mind Map Nodes"
    folder: "content/nodes"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "ID (e.g., math, linear-algebra)", name: "id", widget: "string"}
      - {label: "Label (Short Title)", name: "label", widget: "string"}
      - {label: "Subtitle", name: "sub", widget: "string", required: false}
      - {label: "Tag (e.g., Branch, Overview)", name: "tag", widget: "string"}
      - {label: "Theme Color", name: "theme", widget: "select", options: ["root", "math", "train", "arch", "prompt", "theme"]}
      - {label: "Has Children?", name: "hasChildren", widget: "boolean", default: false}
      - {label: "Sidebar Title", name: "title", widget: "string"}
      - {label: "Sidebar Body Paragraphs (HTML allowed)", name: "body", widget: "text"}

  - name: "pages"
    label: "Website Pages"
    files:
      - file: "content/pages/beginners.json"
        label: "AI for Beginners"
        name: "beginners"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "AI for beginners"}
          - {label: "Page Content", name: "body", widget: "markdown"}
      - file: "content/pages/resources.json"
        label: "Interesting Resources"
        name: "resources"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "Interesting Resources"}
          - {label: "Page Content", name: "body", widget: "markdown"}
      - file: "content/pages/about.json"
        label: "About this site"
        name: "about"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "About this site"}
          - {label: "Page Content", name: "body", widget: "markdown"}
      - file: "content/pages/contact.json"
        label: "Contact"
        name: "contact"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "Contact"}
          - {label: "Page Content", name: "body", widget: "markdown"}
