<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Analysis... · LLMs 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#3d2a18;--gold:#B8860B;--tan:#D2B48C;--cream:#FAF8F4;
  --muted:#9a7a5e;--light:#F5EDD8;--border:rgba(184,134,11,.18);--white:#fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;font-weight:300;background:var(--cream);color:var(--brown);line-height:1.8;font-size:16px}

header{position:sticky;top:0;z-index:100;background:rgba(250,248,244,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between}
.site-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--brown);text-decoration:none;letter-spacing:.02em}
.site-title span{color:var(--gold)}
nav{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
nav a{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:.3rem .7rem;border-radius:20px;transition:color .2s,background .2s}
nav a:hover{color:var(--gold)}

.wrapper{max-width:740px;margin:0 auto;padding:4rem 2rem 6rem}
.back-link{display:inline-block;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);text-decoration:none;margin-bottom:2.5rem;transition:color .2s}
.back-link:hover{color:var(--brown)}

.meta-header{margin-bottom:2rem}
.category-badge{display:inline-block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(184,134,11,.1);color:var(--gold);border:1px solid rgba(184,134,11,.25);padding:2px 10px;border-radius:20px;margin-bottom:1rem}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,2.8rem);font-weight:400;color:var(--brown);line-height:1.2;margin-bottom:1rem}
.date-stamp{font-size:.82rem;color:var(--muted)}

.standfirst{font-size:1.05rem;color:var(--muted);line-height:1.75;margin-bottom:2.5rem;font-style:italic;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.article-body{font-size:1rem;color:var(--brown)}
.article-body p{margin-bottom:1.5rem}

footer{background:var(--brown);color:var(--muted);text-align:center;padding:1.5rem 2rem;font-size:.78rem;letter-spacing:.04em;margin-top:auto}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<header>
  <a href="/" class="site-title"><span>LLMs</span> 101</a>
  <nav>
    <a href="/">Mind Map</a>
    <a href="/guide">Full Guide</a>
    <a href="/models">Models</a>
    <a href="/tracker">Tracker</a>
    <a href="/trends">Trends</a>
  </nav>
</header>

<main class="wrapper">
  <a href="/trends" class="back-link">← Back to Trends</a>
  
  <article id="article-render-target">
    <div class="meta-header" style="text-align: center; padding: 3rem 0;">
      <p style="color: var(--muted); font-size: 0.9rem;">Loading deep analysis stream...</p>
    </div>
  </article>
</main>

<footer>
  <p><a href="/">LLMs 101</a> · <a href="/models">Models</a> · <a href="/tracker">Tracker</a> · <a href="/trends">Trends</a> · <a href="/guide">Full Guide</a></p>
</footer>

<script>
async function loadFullArticle() {
  try {
    // 1. Parse the ?article=slug parameter from the browser window URL
    const urlParams = new URLSearchParams(window.location.search);
    const articleSlug = urlParams.get('article');
    
    if (!articleSlug) {
      throw new Error("No specific analysis identifier requested.");
    }

    // 2. Query the raw JSON content file directly from your database layout
    const response = await fetch(`/content/articles/${articleSlug}.json`);
    if (!response.ok) throw new Error("The requested analysis update does not exist.");
    
    const article = await response.json();
    
    // 3. Format timestamp beautifully
    let formattedDate = "Recent Update";
    if (article.date) {
      const parsedDate = new Date(article.date);
      if (!isNaN(parsedDate)) {
        formattedDate = parsedDate.toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      }
    }

    // 4. Update tab title dynamically
    document.title = `${article.title || 'Analysis'} · LLMs 101`;

    // 5. Inject clean layout components safely
    const target = document.getElementById('article-render-target');
    target.innerHTML = `
      <header class="meta-header">
        <span class="category-badge">${article.category || 'Explainer'}</span>
        <h1>${article.title || 'Untitled Update'}</h1>
        <div class="date-stamp">Published on ${formattedDate}</div>
      </header>
      
      <p class="standfirst">${article.summary || ''}</p>
      
      <div class="article-body">
        <p>${(article.body || '').replace(/\n/g, '<br>')}</p>
      </div>
    `;

  } catch (err) {
    console.error(err);
    document.getElementById('article-render-target').innerHTML = `
      <div style="text-align:center; padding: 3rem 0; color: var(--muted);">
        <h3>Analysis Unavailable</h3>
        <p style="font-size:0.85rem; margin-top:0.5rem;">${err.message}</p>
      </div>
    `;
  }
}

document.addEventListener('DOMContentLoaded', loadFullArticle);
</script>
</body>
</html>
