name: Auto-Generate Content Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/**'
      - 'content/reports/**'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Index Generator
        run: node scripts/generate-indices.js

      - name: Commit and Push Indexes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the freshly generated index files
          git add content/articles_index.json content/reports_index.json
          
          # Commit the changes gracefully
          git commit -m "chore: auto-regenerate content indexes" || echo "No structural changes to commit"
          
          # Push changes directly back to your main branch
          git push origin main
